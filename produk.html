
<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Produk Lokal Dayeuhluhur | Plaza Dayeuhluhur
    </title>

    <meta
        name="description"
        content="Etalase lengkap produk UMKM lokal Kecamatan Dayeuhluhur."
    >


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         STYLE
    ====================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                "Poppins",
                sans-serif;

            background:
                #f5f7fa;

            color:
                #172033;

        }


        /* =====================================================
           HEADER
        ====================================================== */

        .produk-header {

            padding:
                50px 20px 30px;

            text-align:
                center;

        }


        .produk-header .label {

            color:
                #0d6efd;

            font-size:
                14px;

            font-weight:
                800;

            margin-bottom:
                5px;

        }


        .produk-header h1 {

            margin:
                0;

            font-size:
                32px;

            font-weight:
                800;

        }


        .produk-header p {

            max-width:
                850px;

            margin:
                10px auto 0;

            color:
                #667085;

            font-size:
                14px;

        }


        /* =====================================================
           CONTAINER
        ====================================================== */

        .produk-wrapper {

            max-width:
                1250px;

            margin:
                auto;

            padding:
                10px 20px 60px;

        }


        /* =====================================================
           GRID
        ====================================================== */

        #produkContainer {

            display:
                grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(0, 1fr)
                );

            gap:
                20px;

        }


        /* =====================================================
           CARD PRODUK
        ====================================================== */

        .produk-card {

            background:
                #ffffff;

            border-radius:
                16px;

            overflow:
                hidden;

            border:
                1px solid #e9edf3;

            box-shadow:
                0 4px 15px
                rgba(
                    0,
                    0,
                    0,
                    0.07
                );

            height:
                100%;

            display:
                flex;

            flex-direction:
                column;

            transition:
                all 0.25s ease;

        }


        .produk-card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 10px 25px
                rgba(
                    0,
                    0,
                    0,
                    0.11
                );

        }


        /* =====================================================
           GAMBAR
        ====================================================== */

        .produk-card-image {

            width:
                100%;

            height:
                220px;

            object-fit:
                cover;

            display:
                block;

            background:
                #eef1f5;

        }


        /* =====================================================
           BODY
        ====================================================== */

        .produk-card-body {

            padding:
                16px;

            display:
                flex;

            flex-direction:
                column;

            flex:
                1;

        }


        /* =====================================================
           KATEGORI
        ====================================================== */

        .produk-category {

            display:
                inline-block;

            width:
                fit-content;

            background:
                #0d6efd;

            color:
                #ffffff;

            font-size:
                11px;

            font-weight:
                600;

            padding:
                5px 10px;

            border-radius:
                20px;

            margin-bottom:
                9px;

        }


        /* =====================================================
           NAMA PRODUK
        ====================================================== */

        .produk-name {

            font-size:
                17px;

            font-weight:
                700;

            line-height:
                1.35;

            margin:
                0 0 7px;

            color:
                #172033;

        }


        /* =====================================================
           DESKRIPSI
        ====================================================== */

        .produk-description {

            color:
                #667085;

            font-size:
                12px;

            line-height:
                1.6;

            margin:
                0 0 12px;

        }


        /* =====================================================
           INFORMASI UMKM
        ====================================================== */

        .produk-info {

            font-size:
                12px;

            line-height:
                1.8;

            margin-bottom:
                8px;

        }


        .produk-info i {

            width:
                18px;

            color:
                #0d6efd;

        }


        .produk-info .desa-icon {

            color:
                #dc3545;

        }


        .produk-info strong {

            font-weight:
                700;

        }


        /* =====================================================
           HARGA
        ====================================================== */

        .produk-price {

            margin-top:
                auto;

            padding-top:
                10px;

            font-size:
                15px;

            font-weight:
                700;

            color:
                #172033;

        }


        /* =====================================================
           BUTTON WHATSAPP
        ====================================================== */

        .produk-whatsapp {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            width:
                100%;

            margin-top:
                12px;

            padding:
                10px 14px;

            border:
                none;

            border-radius:
                10px;

            background:
                #198754;

            color:
                #ffffff;

            text-decoration:
                none;

            font-size:
                12px;

            font-weight:
                700;

            transition:
                0.2s ease;

        }


        .produk-whatsapp:hover {

            background:
                #157347;

            color:
                #ffffff;

        }


        .produk-whatsapp.disabled {

            background:
                #adb5bd;

            cursor:
                default;

        }


        /* =====================================================
           EMPTY STATE
        ====================================================== */

        .produk-empty {

            grid-column:
                1 / -1;

            text-align:
                center;

            padding:
                60px 20px;

            background:
                #ffffff;

            border-radius:
                16px;

            color:
                #667085;

        }


        .produk-empty i {

            font-size:
                45px;

            margin-bottom:
                15px;

            color:
                #adb5bd;

        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (
            max-width: 1100px
        ) {

            #produkContainer {

                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );

            }

        }


        @media (
            max-width: 768px
        ) {

            .produk-header {

                padding:
                    35px 15px 20px;

            }


            .produk-header h1 {

                font-size:
                    26px;

            }


            #produkContainer {

                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

                gap:
                    15px;

            }


            .produk-card-image {

                height:
                    190px;

            }

        }


        @media (
            max-width: 520px
        ) {

            #produkContainer {

                grid-template-columns:
                    1fr;

            }


            .produk-card-image {

                height:
                    220px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="produk-header">

        <div class="label">
            ETALASE PRODUK UMKM
        </div>


        <h1>
            Produk Lokal Dayeuhluhur
        </h1>


        <p>
            Temukan berbagai produk unggulan masyarakat
            Kecamatan Dayeuhluhur dan hubungi penjual
            secara langsung melalui WhatsApp.
        </p>

    </header>



    <!-- =====================================================
         PRODUK
    ====================================================== -->

    <main class="produk-wrapper">

        <div id="produkContainer">

            <div class="produk-empty">

                <i class="fa-solid fa-spinner fa-spin"></i>

                <div>
                    Memuat produk...
                </div>

            </div>

        </div>

    </main>



    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- =====================================================
         PRODUK JS
    ====================================================== -->

    <script src="assets/js/produk.js"></script>


</body>

</html>
