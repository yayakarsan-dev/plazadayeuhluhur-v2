```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manajemen UMKM | Plaza Dayeuhluhur</title>

    <link rel="stylesheet" href="umkm.css">
</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="page-header">

        <div>
            <h1>Manajemen UMKM</h1>
            <p>Kelola data UMKM Kecamatan Dayeuhluhur</p>
        </div>

        <button id="btnTambahUMKM" class="btn-primary">
            + Tambah UMKM
        </button>

    </header>


    <!-- =====================================================
         STATISTIK
    ====================================================== -->

    <section class="umkm-statistik">

        <div class="stat-card">
            <span>Total UMKM</span>
            <strong id="totalUMKM">0</strong>
        </div>

        <div class="stat-card">
            <span>Jasa</span>
            <strong id="totalJasa">0</strong>
        </div>

        <div class="stat-card">
            <span>Kuliner</span>
            <strong id="totalKuliner">0</strong>
        </div>

        <div class="stat-card">
            <span>Perdagangan</span>
            <strong id="totalPerdagangan">0</strong>
        </div>

    </section>


    <!-- =====================================================
         FILTER
    ====================================================== -->

    <section class="filter-area">

        <input
            type="text"
            id="searchUMKM"
            placeholder="Cari nama UMKM..."
        >

        <select id="filterKategori">

            <option value="">Semua Kategori</option>
            <option value="Kuliner">Kuliner</option>
            <option value="Jasa">Jasa</option>
            <option value="Perdagangan">Perdagangan</option>
            <option value="Pertanian">Pertanian</option>
            <option value="Peternakan">Peternakan</option>
            <option value="Lainnya">Lainnya</option>

        </select>

        <select id="filterDesa">

            <option value="">Semua Desa</option>

        </select>

    </section>


    <!-- =====================================================
         DAFTAR UMKM
    ====================================================== -->

    <main>

        <section id="daftarUMKM" class="umkm-container">

            <!-- Data UMKM akan dibuat oleh JavaScript -->

        </section>

        <div id="emptyUMKM" class="empty-state">

            <h3>Belum ada data UMKM</h3>

            <p>
                Silakan tambahkan data UMKM melalui tombol
                <strong>+ Tambah UMKM</strong>.
            </p>

        </div>

    </main>


    <!-- =====================================================
         MODAL FORM TAMBAH UMKM
    ====================================================== -->

    <div id="modalUMKM" class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>Tambah UMKM</h2>

                <button
                    type="button"
                    id="btnTutupModal"
                    class="btn-close">
                    ×
                </button>

            </div>


            <!-- FORM -->

            <form id="formUMKM">

                <div class="form-group">

                    <label for="namaUMKM">
                        Nama UMKM
                    </label>

                    <input
                        type="text"
                        id="namaUMKM"
                        placeholder="Contoh: WAHYU Barbershop"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="kategoriUMKM">
                            Kategori
                        </label>

                        <select id="kategoriUMKM" required>

                            <option value="">
                                Pilih kategori
                            </option>

                            <option value="Kuliner">
                                Kuliner
                            </option>

                            <option value="Jasa">
                                Jasa
                            </option>

                            <option value="Perdagangan">
                                Perdagangan
                            </option>

                            <option value="Pertanian">
                                Pertanian
                            </option>

                            <option value="Peternakan">
                                Peternakan
                            </option>

                            <option value="Lainnya">
                                Lainnya
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="desaUMKM">
                            Desa
                        </label>

                        <input
                            type="text"
                            id="desaUMKM"
                            placeholder="Contoh: Dayeuhluhur"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="produkUMKM">
                        Produk / Jasa
                    </label>

                    <input
                        type="text"
                        id="produkUMKM"
                        placeholder="Contoh: Potong Rambut Pria"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="ratingUMKM">
                            Rating
                        </label>

                        <input
                            type="number"
                            id="ratingUMKM"
                            min="0"
                            max="5"
                            step="0.1"
                            value="5"
                        >

                    </div>


                    <div class="form-group">

                        <label for="whatsappUMKM">
                            WhatsApp
                        </label>

                        <input
                            type="text"
                            id="whatsappUMKM"
                            placeholder="08xxxxxxxxxx"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="deskripsiUMKM">
                        Deskripsi
                    </label>

                    <textarea
                        id="deskripsiUMKM"
                        rows="4"
                        placeholder="Deskripsi singkat UMKM..."
                    ></textarea>

                </div>


                <!-- BUTTON FORM -->

                <div class="form-actions">

                    <button
                        type="button"
                        id="btnBatal"
                        class="btn-secondary">

                        Batal

                    </button>

                    <button
                        type="submit"
                        class="btn-primary">

                        Simpan UMKM

                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="umkm.js"></script>

</body>
</html>
```
